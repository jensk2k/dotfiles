; Settings for the dotfiles SDDM theme, designed around background.png
; (a copy of ~/Pictures/Wallpapers/x643mr5dqs7h1.png). Fixed colours picked
; from that image; the desktop colour theme (~/.config/theme) doesn't touch them.
[General]
Background="background.png"
Font="JetBrainsMono Nerd Font"
; Royal blue of the image: the carved clock, strips behind text
Blue="#25348e"
; Pale blue of the small terminal windows: secondary text, date
Line="#95bcda"
; Dimmer pale blue: hints, power keys
Dim="#6a93b8"
; Mint of the ASCII art: main text, cursor
Text="#add3c3"
; Magenta and cyan of the ASCII art's colour fringe (on all text); magenta also for errors
Magenta="#b954b8"
Cyan="#4fd0e0"
