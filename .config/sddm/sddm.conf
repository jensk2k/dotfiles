# ~/.config/sddm/sddm.conf
# The whole SDDM config. Installed as /etc/sddm.conf by ~/.config/sddm/install
# (which also removes the old /etc/sddm.conf.d files).

[General]
# No on-screen keyboard
InputMethod=

[Theme]
Current=dotfiles
# Same cursor as the desktop (~/.config/uwsm/env)
CursorTheme=Adwaita
CursorSize=24

[Users]
RememberLastUser=true
RememberLastSession=true
