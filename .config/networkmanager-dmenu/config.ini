# ~/.config/networkmanager-dmenu/config.ini
# Wi-Fi menu opened by clicking the network icon in Waybar.

[dmenu]
# fuzzel dropped down from the top-right corner, under the bar
dmenu_command = fuzzel --anchor top-right --x-margin 10 --y-margin 40 --width 40 --lines 12
compact = True
# Signal strength as icons (needs the Nerd Font)
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name}  {sec}
# Marks the network you're connected to
active_chars = ==
list_saved = False
prompt = Wi-Fi

[dmenu_passphrase]
# Hide the password as you type it
obscure = True

[editor]
# Used for "Edit connections" in the menu
terminal = kitty
gui_if_available = False

[nmdm]
rescan_delay = 5
show_notifications = True
