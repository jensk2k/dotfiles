# ~/.config/hypr/hyprpaper.conf
# Wallpaper daemon. Hyprland starts it from hyprland.lua.

# No Hyprland text drawn on top of the wallpaper
splash = false

# Lets you change wallpaper on the fly:
#   hyprctl hyprpaper wallpaper ', ~/Pictures/Wallpapers/other.jpg'
ipc = true

# One wallpaper for every monitor ("monitor =" left empty means "all").
# fit_mode: cover (fill and crop, default) | contain (fit, with bars) | fill (stretch) | tile
wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers/abstract-terrain.jpg
    fit_mode = cover
}

# Rotating slideshow instead: point path at a folder.
# Remove the block above and uncomment this one.
# wallpaper {
#     monitor =
#     path = ~/Pictures/Wallpapers
#     timeout = 900       # seconds between changes
#     order = random
# }

# A different wallpaper per monitor: add a block with the monitor's name
# (run `hyprctl monitors` to see names such as eDP-1 or DP-2).
# wallpaper {
#     monitor = DP-2
#     path = ~/Pictures/Wallpapers/wide.jpg
# }
