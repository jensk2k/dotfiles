# ~/.config/hypr/hypridle.conf
# Idle handling: dim -> lock -> screen off -> suspend.
# Video players and browsers pause all of this while a video is playing.

general {
    # What "lock" means. Super + L and sleep both go through this.
    # --no-fade-in avoids a flash of the unlocked desktop when waking up.
    lock_cmd = pidof hyprlock || hyprlock --no-fade-in

    # Lock before the machine sleeps (also covers closing a laptop lid)
    before_sleep_cmd = loginctl lock-session

    # Turn the screen back on after waking, so one key press is enough
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 2.5 min: dim a laptop screen (does nothing on desktop monitors)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 30 min: suspend. Delete this block on a desktop you want to stay awake.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
