# ~/.config/hypr/hyprlock.conf
# Lock screen. hyprlock refuses to lock without this file.
# Esc or Ctrl+U clears what you've typed.

$font = JetBrainsMono Nerd Font

# $fg, $accent, ... from ~/.config/theme/palette.lua (run ~/.config/theme/apply)
source = $HOME/.config/theme/generated/hyprlock.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Blurred screenshot of your desktop as the background.
# For your wallpaper instead: path = ~/Pictures/Wallpapers/wallpaper.jpg
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

# Password box, same colours as the window borders
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = $accent $accent2 45deg
    check_color = $accent2 $warn 120deg
    fail_color = $warn $crit 40deg
    font_color = $fg
    fade_on_empty = false
    rounding = 10
    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}

# Date (Danish-style day.month.year)
label {
    monitor =
    text = cmd[update:60000] date +"%A %d.%m.%Y"
    font_size = 22
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}
