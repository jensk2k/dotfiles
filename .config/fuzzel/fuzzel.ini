# ~/.config/fuzzel/fuzzel.ini
# App launcher and dmenu picker (clipboard, power menu, Wi-Fi menu).
# Colours match mako and waybar. Format: RRGGBBAA hex.

[main]
font=JetBrainsMono Nerd Font:size=12
prompt="❯ "
terminal=kitty -e
# Launch apps as uwsm units, like the autostart entries
launch-prefix=uwsm app --
width=40
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=22

[colors]
background=141418d9
text=d0d0d0ff
prompt=33ccffff
input=d0d0d0ff
placeholder=707070ff
match=00ff99ff
selection=282830ff
selection-text=ffffffff
selection-match=00ff99ff
counter=707070ff
border=33ccffff

[border]
width=1
radius=6
