# ~/.config/fuzzel/fuzzel.ini
# App launcher and dmenu picker (clipboard history).

[main]
font=JetBrainsMono Nerd Font:size=11
# Size fonts like mako/waybar (96 DPI); "auto" uses the panel's real ~157 DPI and renders ~1.6x larger
dpi-aware=no
prompt="❯ "
terminal=kitty -e
# Launch apps as uwsm units, like the autostart entries
launch-prefix=uwsm app --
width=40
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=22

# Colours come from ~/.config/theme/palette.lua (run ~/.config/theme/apply)
include=~/.config/theme/generated/fuzzel.ini

[border]
width=1
radius=6
