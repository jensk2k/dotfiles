// autoexec.cfg: runs after q3config.cfg on every start, so these settings win
// over whatever the game saved. q3config.cfg is rewritten on quit; this file isn't.
// Settings marked "latched" need `vid_restart` (or `snd_restart`) to take effect.

// ---- Latency / frame rate ----
set  com_maxfps "250"              // not saved by quake3e (resets to 125), so set it here
seta r_swapInterval "0"            // vsync off (latched: vid_restart)
seta com_maxfpsUnfocused "30"      // save battery while alt-tabbed

// ---- Mouse: raw input, no acceleration or smoothing ----
seta in_mouse "1"
seta cl_mouseAccel "0"
seta m_filter "0"

// ---- Picture ----
// r_fbo renders through a framebuffer: gamma then works on Wayland (hardware gamma
// doesn't: the log said "GAMMA: software") and MSAA becomes available.
seta r_fbo "1"                     // latched
seta r_gamma "1.2"                 // a little brighter than stock 1.0
seta r_ext_multisample "4"         // 4x MSAA, cheap for Q3 even on the iGPU (latched)
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"  // trilinear instead of bilinear
seta r_ext_max_anisotropy "16"     // sharper floors at an angle (latched)

// ---- Sound ----
seta s_khz "44"                    // was 22 kHz (latched: snd_restart)
seta s_mixAhead "0.1"              // less audio delay than the 0.2 s default; raise if it crackles

// ---- Network ----
seta rate "90000"                  // 25000 is a 2000s modem-era value; servers cap it anyway
seta snaps "40"
seta cl_maxpackets "125"

// ---- HUD / view ----
seta cg_drawFPS "1"
seta cg_drawTimer "1"
seta cg_fov "110"                  // wider view for 16:9 (stock 90)
// No view bobbing: the screen moves only when you move the mouse
seta cg_bobup "0"
seta cg_bobpitch "0"
seta cg_bobroll "0"
seta cg_runpitch "0"
seta cg_runroll "0"

// ---- Visibility ----
// Every opponent uses your model, so enemies always look the same. Keel is bright
// and bulky (bones, the old pick, is thin and dark: worst case with forceModel).
seta model "keel"
seta headmodel "keel"
seta team_model "keel"
seta team_headmodel "keel"
seta cg_forceModel "1"
seta cg_simpleItems "1"            // flat item icons instead of spinning models
seta cg_drawGun "0"                // no weapon model in view

// ---- Sensitivity ----
// cm per 360° turn = 360 / (sensitivity * m_yaw) / DPI * 2.54   (m_yaw = 0.022)
// sensitivity 5 is 10.4 cm at 800 DPI (20.8 at 400, 5.2 at 1600): very fast for
// Quake. For about 30 cm: 400 DPI -> 3.46, 800 DPI -> 1.73, 1600 DPI -> 0.87.
seta sensitivity "5"

// ---- Binds ----
// Weapons: the ones you need instantly on the mouse, the rest around WASD.
// Numbers: 1 gauntlet, 2 machinegun, 3 shotgun, 4 grenade, 5 rocket, 6 lightning,
// 7 railgun, 8 plasma, 9 BFG (number keys still work for all of them).
bind MOUSE2 "+zoom"                // hold to zoom (stock: +strafe)
bind MOUSE3 "weapon 5"             // wheel click: rocket launcher (stock: +zoom)
bind MOUSE4 "weapon 7"             // side button: railgun
unbind MOUSE5                      // free (railgun was here; q3config.cfg keeps old binds)
bind q "weapon 3"                  // shotgun (stock: +button3, the useless gesture)
bind e "weapon 6"                  // lightning gun
bind r "weapon 8"                  // plasma gun
// f stays "+button2" (use item: medkit / teleporter)

// Stock binds that only cause accidents
unbind CTRL                        // second fire button
unbind ALT                         // +strafe
unbind \                           // +mlook (mouse look is always on)
unbind UPARROW
unbind DOWNARROW
unbind LEFTARROW
unbind RIGHTARROW
unbind DEL                         // look down
unbind PGDN                        // look up
unbind END                         // centre view
unbind +                           // these four shrink/grow the view
unbind -
unbind =
unbind _
// F5 / F6: vsync on / off, with the vid_restart that r_swapInterval needs (for A/B tests)
bind F5 "seta r_swapInterval 1; vid_restart"
bind F6 "seta r_swapInterval 0; vid_restart"
